spring:
  application:
    name: motor-workshop-api
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motorworkshop}
    username: ${DB_USER:motorworkshop}
    password: ${DB_PASSWORD:motorworkshop}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8081}

app:
  storage:
    work-order-photos: ${PHOTO_STORAGE_PATH:./data/work-order-photos}