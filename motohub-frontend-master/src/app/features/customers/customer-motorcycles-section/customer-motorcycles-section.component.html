<section class="card">
    <div class="row between gap wrap">
        <div>
            <h2>Motorok</h2>
            <p class="muted">
                Az ügyfélhez tartozó motorkerékpárok.
            </p>
        </div>

        <a
            class="button"
            [routerLink]="[
                '/customers',
                customerId,
                'motorcycles',
                'new'
            ]">
            + Új motor
        </a>
    </div>

    <div
        class="motorcycle-customer-list"
        *ngIf="motorcycles.length > 0">

        <a
            class="motorcycle-row"
            *ngFor="let motorcycle of motorcycles"
            [routerLink]="['/motorcycles', motorcycle.id]">

            <div class="motorcycle-info">
                <strong class="motorcycle-name">
                    {{ motorcycle.brand }} {{ motorcycle.model }}
                </strong>

                <div class="muted">
                    {{ motorcycle.licensePlate || 'nincs rendszám' }}

                    <ng-container *ngIf="motorcycle.modelYear">
                        · {{ motorcycle.modelYear }}
                    </ng-container>
                </div>

                <div
                    class="muted"
                    *ngIf="motorcycle.vin">
                    VIN: {{ motorcycle.vin }}
                </div>
            </div>

            <span class="customer-arrow">›</span>
        </a>
    </div>

    <div
        class="empty"
        *ngIf="!loading && motorcycles.length === 0">
        Ehhez az ügyfélhez még nincs motor rögzítve.
    </div>

    <div
        class="muted"
        *ngIf="loading">
        Motorok betöltése…
    </div>
</section>
